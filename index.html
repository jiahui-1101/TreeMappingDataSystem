<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TBJ Tree Mapping System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green-950:#0a1a0e;--green-900:#122318;--green-800:#1a3322;--green-700:#24472f;
  --green-600:#2d5c3c;--green-500:#3a7a50;--green-400:#52a06e;--green-300:#7dc494;
  --green-200:#a8d9b8;--green-100:#d4eede;--green-50:#edf7f0;
  --earth-900:#2c1f0e;--earth-700:#5c3d1a;--earth-500:#a06830;--earth-300:#d4a96a;
  --cream:#faf8f4;--cream-dark:#f0ece3;
  --text-dark:#1a2e1f;--text-mid:#3a5244;--text-light:#6b8f78;
  --border:#c8ddd0;--shadow:rgba(10,26,14,0.12);
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;overflow-x:hidden}

/* AUTH */
.auth-screen{min-height:100vh;display:flex;background:var(--green-900)}
.auth-left{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px;background:linear-gradient(135deg,var(--green-900) 0%,var(--green-700) 100%);position:relative;overflow:hidden}
.auth-left::before{content:'';position:absolute;top:-100px;right:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(52,160,80,.15) 0%,transparent 70%);pointer-events:none}
.auth-leaf-deco{position:absolute;font-size:120px;opacity:.07;bottom:40px;left:20px;transform:rotate(-15deg)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:48px}
.auth-brand-icon{width:44px;height:44px;background:var(--green-400);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.auth-brand-name{color:#fff;font-family:'DM Serif Display',serif;font-size:22px}
.auth-brand-name span{display:block;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--green-300);font-weight:300;letter-spacing:.1em;text-transform:uppercase}
.auth-title{font-family:'DM Serif Display',serif;font-size:42px;color:#fff;line-height:1.15;margin-bottom:16px}
.auth-title em{color:var(--green-300);font-style:italic}
.auth-sub{color:var(--green-200);font-size:14px;line-height:1.7;max-width:360px}
.auth-stats{display:flex;gap:32px;margin-top:48px}
.auth-stat-val{font-size:28px;font-weight:600;color:var(--green-300)}
.auth-stat-lbl{font-size:11px;color:var(--green-200);text-transform:uppercase;letter-spacing:.08em}
.auth-right{width:440px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--cream);padding:60px 48px}
.auth-form-wrap{width:100%}
.auth-form-title{font-family:'DM Serif Display',serif;font-size:30px;color:var(--text-dark);margin-bottom:6px}
.auth-form-sub{font-size:13px;color:var(--text-light);margin-bottom:36px}
.role-tabs{display:flex;gap:6px;margin-bottom:28px;background:var(--cream-dark);padding:4px;border-radius:10px}
.role-tab{flex:1;padding:8px 10px;border:none;background:none;border-radius:8px;font-size:12px;font-weight:500;color:var(--text-light);cursor:pointer;transition:.2s;font-family:inherit}
.role-tab.active{background:#fff;color:var(--green-700);box-shadow:0 1px 4px var(--shadow)}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text-mid);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--text-dark);outline:none;transition:.2s}
.form-input:focus{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(58,122,80,.1)}
.btn-primary{width:100%;padding:13px;background:var(--green-700);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;letter-spacing:.02em}
.btn-primary:hover{background:var(--green-600)}
.auth-divider{text-align:center;font-size:12px;color:var(--text-light);margin:16px 0;position:relative}
.auth-divider::before{content:'';position:absolute;left:0;top:50%;width:40%;height:1px;background:var(--border)}
.auth-divider::after{content:'';position:absolute;right:0;top:50%;width:40%;height:1px;background:var(--border)}
.btn-guest{width:100%;padding:11px;background:transparent;color:var(--text-mid);border:1.5px solid var(--border);border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
.btn-guest:hover{border-color:var(--green-400);color:var(--green-700)}

/* MAIN LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--green-900);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sidebar-brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand-row{display:flex;align-items:center;gap:10px}
.sidebar-brand-icon{width:34px;height:34px;background:var(--green-400);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sidebar-brand-text{color:#fff;font-family:'DM Serif Display',serif;font-size:15px;line-height:1.2}
.sidebar-brand-text span{display:block;font-family:'DM Sans',sans-serif;font-size:10px;color:var(--green-300);font-weight:300;letter-spacing:.1em;text-transform:uppercase}
.sidebar-user{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-user-row{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--green-500);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.user-info-name{font-size:13px;font-weight:500;color:#fff}
.user-info-role{font-size:11px;color:var(--green-300)}
.sidebar-nav{flex:1;padding:16px 0;overflow-y:auto}
.nav-section{margin-bottom:8px}
.nav-section-label{font-size:10px;font-weight:500;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase;padding:8px 20px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:.15s;color:rgba(255,255,255,.6);font-size:13px;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(52,160,80,.15);color:var(--green-300);border-left-color:var(--green-400)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-bottom{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.btn-logout{width:100%;padding:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:rgba(255,255,255,.6);font-size:12px;cursor:pointer;font-family:inherit;transition:.2s}
.btn-logout:hover{background:rgba(255,80,80,.12);border-color:rgba(255,80,80,.3);color:#ff8080}
.main-content{margin-left:240px;flex:1;padding:32px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.page-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text-dark)}
.page-title span{display:block;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text-light);font-weight:400;margin-top:2px}
.topbar-actions{display:flex;gap:10px;align-items:center}
.badge-notif{position:relative;padding:8px 10px;background:#fff;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:16px;transition:.2s}
.badge-notif:hover{border-color:var(--green-400)}
.badge-dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;background:#e05c3a;border-radius:50%;border:2px solid var(--cream)}
.btn-sm{padding:8px 16px;background:var(--green-700);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:.2s}
.btn-sm:hover{background:var(--green-600)}
.btn-sm-outline{padding:8px 16px;background:transparent;color:var(--green-700);border:1.5px solid var(--green-400);border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:.2s}
.btn-sm-outline:hover{background:var(--green-50)}

/* CARDS */
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px 22px}
.card-title{font-size:14px;font-weight:600;color:var(--text-dark);margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text-light)}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.metric-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.metric-icon{font-size:22px;margin-bottom:10px}
.metric-val{font-size:26px;font-weight:600;color:var(--text-dark);line-height:1}
.metric-lbl{font-size:11px;color:var(--text-light);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.metric-trend{font-size:11px;margin-top:6px;font-weight:500}
.metric-trend.up{color:#3a9e5f}
.metric-trend.down{color:#e05c3a}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}

/* TREE TABLE */
.tree-table{width:100%;border-collapse:collapse}
.tree-table th{font-size:11px;font-weight:500;color:var(--text-light);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em}
.tree-table td{padding:12px 12px;border-bottom:1px solid var(--cream-dark);font-size:13px}
.tree-table tr:last-child td{border-bottom:none}
.tree-table tr:hover td{background:var(--green-50)}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.status-healthy{background:#d4eede;color:#1a6b3a}
.status-monitor{background:#fef3d0;color:#8a5f00}
.status-critical{background:#fee5e0;color:#8a2500}

/* AI ALERT */
.alert-card{border-radius:12px;padding:16px 18px;margin-bottom:12px;display:flex;align-items:flex-start;gap:14px}
.alert-critical{background:#fee5e0;border:1px solid #f0a090}
.alert-warning{background:#fef3d0;border:1px solid #e8c870}
.alert-info{background:var(--green-50);border:1px solid var(--green-200)}
.alert-icon{font-size:20px;flex-shrink:0;margin-top:2px}
.alert-title{font-size:13px;font-weight:600;color:var(--text-dark)}
.alert-body{font-size:12px;color:var(--text-mid);margin-top:2px;line-height:1.5}
.alert-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:var(--green-700);color:#fff;margin-top:6px}

/* SCHEDULE */
.schedule-grid{display:grid;grid-template-columns:80px repeat(5,1fr);gap:8px;margin-top:12px}
.sched-header{font-size:11px;font-weight:500;color:var(--text-light);text-align:center;padding:6px;text-transform:uppercase;letter-spacing:.05em}
.sched-ranger{font-size:12px;font-weight:500;color:var(--text-dark);padding:8px 6px;display:flex;align-items:center;gap:6px}
.sched-cell{border-radius:8px;padding:8px 6px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;transition:.15s;min-height:48px;display:flex;flex-direction:column;justify-content:center;line-height:1.3}
.sched-empty{background:var(--cream-dark);color:var(--text-light)}
.sched-zone-a{background:#d4eede;color:#1a5e30}
.sched-zone-b{background:#d0e8f5;color:#1a4a6e}
.sched-zone-c{background:#eeddd0;color:#6e3a1a}
.sched-zone-d{background:#edd0ee;color:#5a1a6e}
.sched-emergency{background:#fee5e0;color:#8a2500}

/* VISITOR PORTAL */
.visitor-hero{background:linear-gradient(135deg,var(--green-800) 0%,var(--green-600) 100%);border-radius:16px;padding:32px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden}
.visitor-hero::before{content:'🌿';position:absolute;right:-10px;bottom:-20px;font-size:120px;opacity:.1;transform:rotate(-15deg)}
.visitor-hero h1{font-family:'DM Serif Display',serif;font-size:28px;margin-bottom:8px}
.visitor-hero p{font-size:13px;opacity:.8;max-width:500px;line-height:1.6}
.route-pref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.pref-card{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;cursor:pointer;transition:.2s;text-align:center}
.pref-card:hover,.pref-card.selected{background:rgba(255,255,255,.25);border-color:#fff}
.pref-card-icon{font-size:22px;margin-bottom:4px}
.pref-card-lbl{font-size:11px;font-weight:500}
.tree-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}
.tree-card:hover{border-color:var(--green-400);transform:translateY(-2px);box-shadow:0 4px 16px var(--shadow)}
.tree-card-img{height:90px;background:linear-gradient(135deg,var(--green-200),var(--green-100));display:flex;align-items:center;justify-content:center;font-size:40px}
.tree-card-body{padding:12px 14px}
.tree-card-name{font-size:13px;font-weight:600;color:var(--text-dark)}
.tree-card-sci{font-size:11px;color:var(--text-light);font-style:italic}
.tree-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.collected-badge{font-size:10px;font-weight:500;color:var(--green-600);background:var(--green-50);padding:2px 8px;border-radius:10px}

/* CHATBOT */
.chat-wrap{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;padding:4px}
.chat-msg{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.55}
.chat-bot{background:var(--cream-dark);color:var(--text-dark);border-bottom-left-radius:4px;align-self:flex-start}
.chat-user{background:var(--green-700);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.chat-input-row{display:flex;gap:8px;margin-top:14px}
.chat-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;outline:none}
.chat-input:focus{border-color:var(--green-500)}
.chat-send{padding:10px 16px;background:var(--green-700);color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit}

/* MAP */
.map-wrap{background:linear-gradient(160deg,#b8ddb5 0%,#8ec98a 30%,#74b87a 60%,#9ecf9c 100%);border-radius:14px;position:relative;overflow:hidden}
.map-bg-detail{position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23388E3C' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.map-zone-label{position:absolute;background:rgba(255,255,255,.75);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:600;color:var(--text-dark)}
.map-path-line{position:absolute;border:2px dashed rgba(255,255,255,.6);border-radius:4px}
.map-route-overlay{position:absolute;pointer-events:none}
.map-pin{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
.map-pin-dot{width:26px;height:26px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:.2s}
.map-pin-dot:hover{transform:scale(1.2)}
.map-pin-label{font-size:10px;font-weight:600;color:var(--text-dark);background:rgba(255,255,255,.92);padding:2px 7px;border-radius:6px;margin-top:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pin-healthy{background:#43a047}
.pin-monitor{background:#fb8c00}
.pin-critical{background:#e53935}
.pin-ranger{background:#1565c0}
.map-overlay-card{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.96);border-radius:12px;padding:14px 16px;width:200px;border:1px solid var(--border);box-shadow:0 2px 12px var(--shadow)}
.map-overlay-title{font-size:12px;font-weight:600;color:var(--text-dark);margin-bottom:8px}
.map-legend{display:flex;flex-direction:column;gap:6px}
.map-legend-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-mid)}
.map-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.map-layer-btn{padding:5px 10px;border-radius:6px;font-size:10px;font-weight:500;cursor:pointer;font-family:inherit;transition:.2s;border:1.5px solid var(--border);background:#fff;color:var(--text-mid)}
.map-layer-btn.active{background:var(--green-700);color:#fff;border-color:var(--green-700)}
.ranger-pos{position:absolute;z-index:5}
.ranger-dot{width:20px;height:20px;border-radius:50%;background:#1565c0;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ranger-dot-label{font-size:9px;background:#1565c0;color:#fff;padding:1px 5px;border-radius:4px;margin-top:2px;white-space:nowrap}

/* QR Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:16px;padding:28px;width:400px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text-dark)}
.modal-close{font-size:20px;cursor:pointer;color:var(--text-light);background:none;border:none;padding:4px}
.qr-box{width:120px;height:120px;background:var(--green-50);border:2px dashed var(--green-400);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:50px;margin:0 auto 16px}
.tree-detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--cream-dark);font-size:13px}
.tree-detail-row:last-child{border-bottom:none}
.tree-detail-label{color:var(--text-light);font-weight:500}
.tree-detail-val{color:var(--text-dark);text-align:right}

/* AI Diagnosis */
.diagnosis-card{border-radius:10px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border)}
.diagnosis-rank{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.diagnosis-name{font-size:14px;font-weight:600;color:var(--text-dark);margin-bottom:2px}
.diagnosis-conf{font-size:12px;color:var(--text-light);margin-bottom:6px}
.confidence-bar{height:6px;background:var(--cream-dark);border-radius:3px;overflow:hidden}
.confidence-fill{height:100%;border-radius:3px;background:var(--green-500)}
.diagnosis-treatment{font-size:12px;color:var(--text-mid);margin-top:8px;padding-top:8px;border-top:1px solid var(--cream-dark);line-height:1.5}

/* Audit Log */
.log-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--cream-dark);align-items:flex-start}
.log-time{font-size:11px;color:var(--text-light);white-space:nowrap;font-weight:500;min-width:80px}
.log-event-type{font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;flex-shrink:0}
.log-type-login{background:#d4eede;color:#1a5e30}
.log-type-edit{background:#d0e8f5;color:#1a4a6e}
.log-type-error{background:#fee5e0;color:#8a2500}
.log-type-alert{background:#fef3d0;color:#8a5f00}
.log-desc{font-size:12px;color:var(--text-dark);line-height:1.5}

/* RANGER MOBILE */
.mobile-frame{width:300px;background:#fff;border-radius:28px;border:2px solid var(--green-800);overflow:hidden;box-shadow:0 8px 32px var(--shadow)}
.mobile-statusbar{background:var(--green-900);display:flex;justify-content:space-between;padding:8px 16px;font-size:11px;color:#fff}
.mobile-time{font-weight:600}
.mobile-header{background:var(--green-800);padding:12px 16px;color:#fff}
.mobile-header-title{font-size:15px;font-weight:600;margin-bottom:2px}
.mobile-header-sub{font-size:11px;opacity:.7}
.mobile-body{padding:12px;max-height:380px;overflow-y:auto}
.task-item{background:var(--cream-dark);border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid var(--green-500)}
.task-item.emergency{border-left-color:#e53935;background:#fff5f5}
.task-priority-badge{font-size:10px;font-weight:700;color:#e53935;margin-bottom:4px}
.task-name{font-size:13px;font-weight:600;color:var(--text-dark);margin-bottom:2px}
.task-zone{font-size:11px;color:var(--text-light);margin-bottom:8px}
.task-actions{display:flex;gap:6px}
.task-btn{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;border:none}
.task-btn-primary{background:var(--green-700);color:#fff}
.task-btn-outline{background:transparent;border:1px solid var(--green-500);color:var(--green-700)}

/* CHARTS */
.chart-container{display:flex;flex-direction:column;height:160px;justify-content:flex-end}
.bar-chart{display:flex;gap:8px;align-items:flex-end;height:130px;margin-bottom:8px}
.bar{flex:1;border-radius:4px 4px 0 0;min-width:20px;transition:.3s;cursor:pointer}
.bar:hover{opacity:.8}
.bar-labels{display:flex;gap:8px}
.bar-label{flex:1;text-align:center;font-size:10px;color:var(--text-light);min-width:20px}
.line-chart-svg{width:100%;height:120px}
.donut-wrap{position:relative;width:80px;height:80px;margin:0 auto 8px}
.donut-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.donut-num{font-size:18px;font-weight:600;color:var(--text-dark)}
.donut-lbl{font-size:9px;color:var(--text-light)}

/* Progress */
.prog-wrap{height:6px;background:var(--cream-dark);border-radius:3px;overflow:hidden;width:100%}
.prog-bar{height:100%;background:var(--green-500);border-radius:3px;transition:.3s}

/* Filter bar */
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:200px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;outline:none;background:#fff}
.search-input:focus{border-color:var(--green-500)}
.filter-select{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:12px;font-family:inherit;outline:none;background:#fff;cursor:pointer;color:var(--text-dark)}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:8px 16px;border:none;background:none;font-size:13px;font-weight:500;color:var(--text-light);cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.2s}
.tab.active{color:var(--green-700);border-bottom-color:var(--green-500)}

/* Spatial */
.spatial-map{background:linear-gradient(160deg,#b8ddb5,#8ec98a);border-radius:12px;height:260px;position:relative;overflow:hidden;margin-bottom:14px}
.spatial-proposed{position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(255,200,0,.8);border:3px dashed #fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,0,.4)}50%{box-shadow:0 0 0 8px rgba(255,200,0,0)}}
.suitability-meter{display:flex;align-items:center;gap:10px;margin-top:12px}
.suit-label{font-size:12px;font-weight:500;color:var(--text-mid);white-space:nowrap}
.suit-bar-wrap{flex:1;height:8px;background:var(--cream-dark);border-radius:4px;overflow:hidden}
.suit-bar{height:100%;background:linear-gradient(90deg,var(--green-500),var(--green-300));border-radius:4px}
.suit-score{font-size:12px;font-weight:600;color:var(--green-700);white-space:nowrap}

/* Badge */
.badge-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.badge-item{text-align:center}
.badge-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 4px}
.badge-unlocked{background:var(--green-100);border:2px solid var(--green-400)}
.badge-locked{background:var(--cream-dark);border:2px solid var(--border);filter:grayscale(1);opacity:.5}
.badge-name{font-size:10px;color:var(--text-mid);font-weight:500}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500}
.tag-green{background:var(--green-50);color:var(--green-700);border:1px solid var(--green-200)}
.tag-amber{background:#fef3d0;color:#8a5f00;border:1px solid #f0d880}
.tag-red{background:#fee5e0;color:#8a2500;border:1px solid #f0a090}
.tag-blue{background:#d0e8f5;color:#1a4a6e;border:1px solid #90c8e8}
.tag-purple{background:#edd0ee;color:#5a1a6e;border:1px solid #d090e0}

/* Route result overlay */
.route-result{background:rgba(255,255,255,.95);border-radius:12px;padding:16px;margin-top:12px;border:1px solid var(--green-200)}
.route-step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--cream-dark)}
.route-step:last-child{border-bottom:none}
.route-step-num{width:22px;height:22px;border-radius:50%;background:var(--green-700);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.route-step-info{flex:1}
.route-step-name{font-size:13px;font-weight:600;color:var(--text-dark)}
.route-step-detail{font-size:11px;color:var(--text-light);margin-top:2px}
.route-step-dist{font-size:11px;color:var(--green-600);font-weight:500}

/* Ranger assign modal */
.ranger-assign-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cream-dark)}
.ranger-assign-row:last-child{border-bottom:none}
.ranger-assign-info{display:flex;align-items:center;gap:10px}
.ranger-zone-badge{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500}

/* Stat mini */
.stat-mini{background:var(--green-50);border:1px solid var(--green-100);border-radius:10px;padding:10px 14px;text-align:center}
.stat-mini-val{font-size:22px;font-weight:700;color:var(--green-700)}
.stat-mini-lbl{font-size:10px;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em}

/* SVG inline chart */
.svg-chart-label{font-size:10px;fill:#6b8f78;font-family:DM Sans,sans-serif}

/* Tooltip */
.tooltip{position:relative;display:inline-block}
.tooltip-text{visibility:hidden;background:var(--green-900);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;z-index:50}
.tooltip:hover .tooltip-text{visibility:visible}

/* Shimmer loading */
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.shimmer{animation:shimmer 1.5s infinite;background:linear-gradient(90deg,#f0ece3 25%,#e8e4db 50%,#f0ece3 75%);background-size:400px 100%}
</style>

    const userMsg={role:'user',text:chatInput};

            React.createElement('div',{key:l},

            )
          )
        )

      React.createElement('div',{className:'auth-right'},
        React.createElement('div',{className:'auth-form-wrap'},
          React.createElement('h2',{className:'auth-form-title'},'Sign In'),
          React.createElement('p',{className:'auth-form-sub'},'Select your role to continue'),
          React.createElement('div',{className:'role-tabs'},
            ...[['admin','👨‍💼 Admin'],['ranger','🌲 Ranger'],['visitor','👤 Visitor']].map(([r,lbl])=>

        React.createElement('div',{className:'map-wrap',style:{height:'280px'}},
          React.createElement('div',{className:'map-bg-detail'}),
          React.createElement(MapSVG,{

          generatedRoute&&React.createElement('div',{style:{position:'absolute',top:'12px',left:'12px',background:'rgba(255,235,59,0.9)',borderRadius:'8px',padding:'6px 10px',fontSize:'11px',fontWeight:'700',color:'#333'}},'🗺️ Your route is shown in yellow'),

            React.createElement('div',{className:'map-overlay-title'},'Legend'),

                  ...(generatedRoute?[['#ffeb3b','Your route']]:[])

                  React.createElement('div',{className:'map-legend-dot',style:{background:c}}),l

              )
            )
          )
        )
      ),

      // Generated Route Steps
      generatedRoute&&React.createElement('div',{className:'card',style:{marginBottom:'16px'}},

              React.createElement('div',{className:'route-step-name'},t.icon+' '+t.name),
              React.createElement('div',{className:'route-step-detail'},'Zone '+t.zone+' · '+t.sci+' · '+t.age+' years old')

          )
        ),
        React.createElement('div',{style:{marginTop:'12px',display:'flex',gap:'8px'}},
          React.createElement('button',{className:'btn-sm',style:{flex:1}},'▶ Start Navigation'),
          React.createElement('button',{className:'btn-sm-outline',style:{flex:1}},'💾 Save Route')
        )
      ),

      React.createElement('div',{className:'metrics-grid'},
        ...[['🌳','1,247','Trees in Garden'],['🔍','3','Collected Today'],['🏅','3/10','Badges Unlocked'],['🗺️','~2hr','Estimated Walk']].map(([ic,v,l])=>
          React.createElement('div',{key:l,className:'metric-card'},
            React.createElement('div',{className:'metric-icon'},ic),

  function renderTreeCards(){

        React.createElement('button',{className:'tab active'},'Explorer Mode'),
        React.createElement('button',{className:'tab'},'Expert Mode')
      ),
      React.createElement('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px',marginBottom:'20px'}},
        ...TREES.map(t=>
          React.createElement('div',{key:t.id,className:'tree-card',onClick:()=>setModal(t)},
            React.createElement('div',{className:'tree-card-img'},t.icon),
            React.createElement('div',{className:'tree-card-body'},
              React.createElement('div',{className:'tree-card-name'},t.name),
              React.createElement('div',{className:'tree-card-sci'},t.sci),
              React.createElement('div',{className:'tree-card-footer'},

              )
            )
          )
        )
      ),
      modal&&React.createElement('div',{className:'modal-overlay',onClick:()=>setModal(null)},
        React.createElement('div',{className:'modal',onClick:e=>e.stopPropagation()},
          React.createElement('div',{className:'modal-header'},
            React.createElement('div',{className:'modal-title'},modal.icon,' ',modal.name),
            React.createElement('button',{className:'modal-close',onClick:()=>setModal(null)},'✕')
          ),
          React.createElement('em',{style:{display:'block',textAlign:'center',fontSize:'13px',color:'var(--text-light)',marginBottom:'16px'}},modal.sci),
          React.createElement('p',{style:{fontSize:'13px',color:'var(--text-mid)',lineHeight:'1.7',marginBottom:'16px'}},
            'A beautiful specimen found in Zone '+modal.zone+'. This '+modal.age+'-year-old tree stands '+modal.height+' tall. Health score: '+modal.health+'%.'
          ),
          React.createElement('button',{className:'btn-primary',style:{marginBottom:'8px'}},'🏅 Collect This Tree'),
          React.createElement('button',{className:'btn-sm-outline',style:{width:'100%'}},'💬 Ask AI About This Tree')
        )
      )
    );
  }

  // ── CHATBOT ──────────────────────────────────────
  function renderChatbot(){
    return React.createElement('div',{className:'grid-2'},
      React.createElement('div',{className:'card'},
        React.createElement('div',{style:{display:'flex',gap:'10px',alignItems:'center',marginBottom:'14px',padding:'12px',background:'var(--green-50)',borderRadius:'10px',border:'1px solid var(--green-200)'}},
          React.createElement('span',{style:{fontSize:'28px'}},'🌿'),
          React.createElement('div',null,
            React.createElement('div',{style:{fontWeight:'600',fontSize:'14px',color:'var(--text-dark)'}},'TBJ Botanical AI Assistant'),
            React.createElement('div',{style:{fontSize:'11px',color:'var(--text-light)'}},'Powered by Gemini · Ask anything about our trees!')
          )
        ),
        React.createElement('div',{className:'chat-wrap'},
          ...chatMsgs.map((m,i)=>
            React.createElement('div',{key:i,className:'chat-msg '+(m.role==='bot'?'chat-bot':'chat-user')},m.text)
          ),
          React.createElement('div',{ref:chatEndRef})
        ),
        React.createElement('div',{className:'chat-input-row'},
          React.createElement('input',{className:'chat-input',placeholder:'Ask about any tree in Taman Botani Johor...',value:chatInput,onChange:e=>setChatInput(e.target.value),onKeyDown:e=>e.key==='Enter'&&sendChat()}),
          React.createElement('button',{className:'chat-send',onClick:sendChat},'Send')
        ),
        React.createElement('div',{style:{display:'flex',gap:'6px',marginTop:'10px',flexWrap:'wrap'}},
          ...['What is Angsana?','Rare trees here?','Best time to visit Zone A?','Which trees are diseased?'].map(q=>
            React.createElement('button',{key:q,onClick:()=>{setChatInput(q)},className:'btn-sm-outline',style:{fontSize:'11px',padding:'5px 10px'}},q)
          )
        )
      ),
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'card-title',style:{marginBottom:'14px'}},'🌳 Featured Tree Today'),
        React.createElement('div',{style:{textAlign:'center',fontSize:'64px',margin:'8px 0'}},'🌴'),
        React.createElement('div',{style:{textAlign:'center',marginBottom:'16px'}},
          React.createElement('div',{style:{fontFamily:'DM Serif Display,serif',fontSize:'22px',color:'var(--text-dark)'}},'Meranti Merah'),
          React.createElement('em',{style:{fontSize:'13px',color:'var(--text-light)'}},'Shorea parvifolia'),
          React.createElement('div',{style:{marginTop:'8px',display:'flex',gap:'8px',justifyContent:'center'}},
            React.createElement('span',{className:'tag tag-red'},'Spesies Nadir'),
            React.createElement('span',{className:'tag tag-green'},'Zone B'),
            React.createElement('span',{className:'tag tag-amber'},'80+ years old')
          )
        ),
        React.createElement('p',{style:{fontSize:'13px',color:'var(--text-mid)',lineHeight:'1.7',textAlign:'center',marginBottom:'16px'}},
          'One of Malaysia\'s tallest native trees, reaching 30m height. A rare and protected species. Named for its reddish timber, this towering giant is over 80 years old!'
        ),
        React.createElement('button',{className:'btn-primary'},'🏅 Collect Meranti Merah')
      )
    );
  }

  // ── COLLECTION ──────────────────────────────────────
  function renderCollection(){
    return React.createElement('div',null,
      React.createElement('div',{className:'metrics-grid',style:{marginBottom:'20px'}},
        ...[['🏅','3','Badges Earned'],['🌳','3','Trees Found'],['🏆','30%','Collection %'],['🌿','Rare!','Rarest Find']].map(([ic,v,l])=>
          React.createElement('div',{key:l,className:'metric-card'},
            React.createElement('div',{className:'metric-icon'},ic),
            React.createElement('div',{className:'metric-val'},v),
            React.createElement('div',{className:'metric-lbl'},l)
          )
        )
      ),
      React.createElement('div',{className:'card',style:{marginBottom:'16px'}},
        React.createElement('div',{className:'card-title',style:{marginBottom:'6px'}},L.collect+' – '+L.trees+': 3/10'),

        React.createElement('div',{className:'badge-grid'},
          ...BADGES.map((b,i)=>
            React.createElement('div',{key:i,className:'badge-item'},
              React.createElement('div',{className:'badge-icon '+(b.unlocked?'badge-unlocked':'badge-locked')},b.icon),
              React.createElement('div',{className:'badge-name'},b.name)

            React.createElement('div',{style:{fontSize:'28px',lineHeight:1}},t.icon),
            React.createElement('div',{style:{flex:1}},
              React.createElement('div',{style:{fontSize:'13px',fontWeight:'600',color:'var(--text-dark)'}},t.name),
              React.createElement('em',{style:{fontSize:'11px',color:'var(--text-light)'}},t.sci),
              React.createElement('div',{style:{fontSize:'11px',color:'var(--text-light)',marginTop:'2px'}},'Scanned: 28 Apr 2025 · Zone '+t.zone)
            ),
            React.createElement('span',{className:'tag tag-green'},'✓ Collected')
          )
        )
      )

  function renderContent(){
    if(activeNav==='dashboard')return renderDashboard();
    if(activeNav==='treeinventory')return renderTreeInventory();
    if(activeNav==='diagnosis')return renderDiagnosis();
    if(activeNav==='maintenance')return renderMaintenance();
    if(activeNav==='schedule')return renderSchedule();
    if(activeNav==='rangers')return renderRangerManagement();
    if(activeNav==='tasks')return role==='ranger'?renderRangerTasks():renderTaskTracker();
    if(activeNav==='map')return renderMap();
    if(activeNav==='spatial')return renderSpatial();
    if(activeNav==='auditlog')return renderAuditLog();
    if(activeNav==='explore')return renderExplore();
    if(activeNav==='treecards')return renderTreeCards();
    if(activeNav==='chatbot')return renderChatbot();
    if(activeNav==='collection')return renderCollection();
    return renderDashboard();
  }

  const roleNav=navItems[role]||navItems.admin;
  const pageTitles={
    dashboard:'Dashboard',treeinventory:'Tree Inventory',diagnosis:'AI Disease Diagnosis',
    maintenance:'Predictive Maintenance',schedule:'Workforce Schedule',rangers:'Ranger Management',
    tasks:'Task Tracker',map:'Garden Map',spatial:'Spatial Planning',auditlog:'Audit Log',
    explore:'Explore Garden',treecards:'Tree Profiles',chatbot:'AI Botanical Assistant',collection:'My Badge Collection'
  };
  const pageSubs={
    dashboard:'Overview, analytics & AI insights',treeinventory:'Centralized tree database',
    diagnosis:'Upload image for AI analysis',maintenance:'Proactive care alerts',
    schedule:'Weekly patrol assignments',rangers:'Manage and assign rangers',
    tasks:'Field task management',map:'Interactive garden visualization',
    spatial:'AI tree placement simulation',auditlog:'System security & event tracking',
    explore:'Discover & generate your route',treecards:'Learn about our trees',
    chatbot:'Ask anything about our plants',collection:'Your botanical discoveries'
  };

  return React.createElement('div',{className:'app'},
    React.createElement('nav',{className:'sidebar'},
      React.createElement('div',{className:'sidebar-brand'},
        React.createElement('div',{className:'sidebar-brand-row'},
          React.createElement('div',{className:'sidebar-brand-icon'},'🌳'),
          React.createElement('div',{className:'sidebar-brand-text'},'TBJ System',React.createElement('span',null,'Taman Botani Johor'))
        )
      ),
      React.createElement('div',{className:'sidebar-user'},
        React.createElement('div',{className:'sidebar-user-row'},
          React.createElement('div',{className:'user-avatar'},u.avatar),
          React.createElement('div',null,
            React.createElement('div',{className:'user-info-name'},u.name),
            React.createElement('div',{className:'user-info-role'},u.role)

        )

      React.createElement('div',{className:'sidebar-nav'},
        ...roleNav.map(section=>
          React.createElement('div',{key:section.section,className:'nav-section'},
            React.createElement('div',{className:'nav-section-label'},section.section),
            ...section.items.map(item=>
              React.createElement('div',{key:item.id,className:'nav-item'+(activeNav===item.id?' active':''),onClick:()=>{setActiveNav(item.id);setModal(null)}},
                React.createElement('span',{className:'nav-icon'},item.icon),
                item.label
              )
            )
          )
        )
      ),
      React.createElement('div',{className:'sidebar-bottom'},
        React.createElement('button',{className:'btn-logout',onClick:()=>{setScreen('auth');setLoginId('');setLoginPass('')}},'← Sign Out')
      )

    React.createElement('main',{className:'main-content'},
      React.createElement('div',{className:'topbar'},
        React.createElement('div',{className:'page-title'},
          pageTitles[activeNav]||'Dashboard',
          React.createElement('span',null,pageSubs[activeNav]||'')
        ),
        React.createElement('div',{className:'topbar-actions'},
          React.createElement('div',{className:'badge-notif'},'🔔',React.createElement('div',{className:'badge-dot'})),
          React.createElement('div',{style:{fontSize:'12px',color:'var(--text-light)'}},new Date().toLocaleDateString('en-MY',{day:'numeric',month:'long',year:'numeric'}))
        )

      renderContent()

}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
